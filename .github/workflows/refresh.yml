name: weekly-refresh

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC (AIID snapshots land on Sundays)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore embedding + model cache
        uses: actions/cache@v4
        with:
          path: |
            data/processed/emb_cache.npz
            cache/fastembed
          key: radar-emb-${{ github.run_id }}
          restore-keys: radar-emb-
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHON: python
        run: ./run_all.sh
      - name: Commit refreshed labels, results and dashboard data
        run: |
          git config user.name "ai-incident-radar bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labels results docs/data docs/figures
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Weekly data refresh $(date -u +%F)"
          git push
